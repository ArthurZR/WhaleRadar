name: Radar

on:
  schedule:
    # O "despertador" principal é o cron-job.org: ele chama o GitHub a cada
    # 15 minutos, no horário exato (botão "Run workflow" via API).
    # Este agendamento do próprio GitHub é só reserva, 1 vez por hora, caso o
    # cron-job.org falhe. Fica no minuto 41 para não coincidir com ele.
    # Quedas bruscas entre uma checagem e outra não escapam: o bot revê minuto a
    # minuto todo o período desde a checagem anterior.
    - cron: "41 * * * *"
  # Permite rodar na mão pela aba "Actions" do GitHub (botão "Run workflow").
  workflow_dispatch:
    inputs:
      teste:
        description: "Mandar mensagem de teste com os preços (ignora as regras de queda)"
        type: boolean
        default: false

# Nunca roda duas vezes ao mesmo tempo (evita bagunçar a memória dos alertas).
concurrency: radar

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A memória do anti-spam (pasta .estado) é guardada no cache do GitHub
      # entre uma execução e outra. Aqui pegamos a versão mais recente.
      - name: Recuperar memória dos alertas
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Rodar o radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py ${{ inputs.teste && '--teste' || '' }}

      # Guarda a memória mesmo se algo falhou depois de um alerta já enviado.
      - name: Guardar memória dos alertas
        if: always() && hashFiles('.estado/*') != ''
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}
