# Configurações do WhaleRadar.
# Tudo que você pode querer ajustar fica aqui — não precisa mexer no código.

# Moedas acompanhadas.
# "id" é o nome que a CoinGecko usa; "simbolo" é como aparece na mensagem.
moedas:
  - id: bitcoin
    simbolo: BTC
    coinbase: BTC-USD   # nome na Coinbase (preço minuto a minuto, para quedas bruscas)
    emoji: "🪙"
    noticias: [Bitcoin, BTC]   # 1º = termo pesquisado no Google Notícias; a manchete precisa citar um destes
    perfil: longo_prazo   # comprar e segurar (veja "termometro" lá embaixo)
    # Números do backtest (28/10/2026, 2 anos). Depois de rodar um backtest novo,
    # copie os valores da seção "Valores para o config.yaml" do relatório.
    historico:
      queda_extra_com_sinal: 8.2   # % que o preço ainda caiu, no caso típico, depois de um 🎯
      prazo_queda_extra: 30 dias
      altas_seguiram_subindo: 63   # % das altas fortes em que o preço estava mais alto 7 dias depois
  - id: ethereum
    simbolo: ETH
    coinbase: ETH-USD
    emoji: "🔷"
    noticias: [Ethereum, Ether, ETH]
    perfil: longo_prazo   # segurar, comprando mais em quedas fortes
    historico:
      queda_extra_com_sinal: 15.4
      prazo_queda_extra: 30 dias
      altas_seguiram_subindo: 50
  - id: solana
    simbolo: SOL
    coinbase: SOL-USD
    emoji: "🟣"
    noticias: [Solana, SOL]
    perfil: curto_prazo   # comprar e vender
    historico:
      queda_extra_com_sinal: 3.2
      prazo_queda_extra: 3 dias
      altas_seguiram_subindo: 46

# Quando avisar (perfil "alertas mais frequentes").
# Basta UMA destas condições acontecer para a moeda gerar alerta.
# Os números são em %, e negativos porque são quedas.
limites_queda:
  "15min": -2   # queda brusca: caiu 2% ou mais em até 15 minutos, desde a última checagem
  "1h": -3     # caiu 3% ou mais na última hora
  "24h": -4     # caiu 4% ou mais nas últimas 24 horas
  "7d": -10     # caiu 10% ou mais nos últimos 7 dias
  "distancia_maxima": -10   # está 10% ou mais abaixo do preço mais alto dos últimos 7 dias

# Altas mais fortes que o normal (avisos com 🚀, sem termômetro de compra).
# Números positivos porque são altas.
limites_alta:
  "15min": 2    # alta brusca: subiu 2% ou mais em até 15 minutos
  "1h": 3       # subiu 3% ou mais na última hora
  "24h": 6      # subiu 6% ou mais nas últimas 24 horas
  "7d": 15      # subiu 15% ou mais nos últimos 7 dias

# Anti-spam: evita que a mesma moeda fique avisando sem parar.
anti_spam:
  # Depois de um alerta, a mesma moeda fica em silêncio por pelo menos este tempo.
  intervalo_horas: 4
  # Passado esse tempo, só avisa de novo se o preço caiu MAIS este tanto (%)
  # desde o último alerta (ou subiu mais, no caso dos avisos de alta). Assim não
  # chega o mesmo aviso repetido quando o preço fica parado.
  # Quedas e altas têm memórias separadas.
  nova_queda_minima: 2
  # Depois deste tempo, a memória "zera" e qualquer queda nova volta a avisar.
  esquecer_apos_horas: 24
  # Quedas bruscas furam o silêncio de 4h (são justamente o que você quer saber
  # na hora), desde que o preço tenha caído mais "nova_queda_minima" desde o
  # último alerta e já tenham passado pelo menos estes minutos.
  intervalo_brusca_minutos: 30

# Termômetro de compra (vai junto com os alertas de queda).
# Cada critério cumprido vale 1 ponto (de 0 a 5). Com "pontos_para_interesse"
# ou mais, a leitura vira 🎯 "possível zona de compra"; abaixo disso, ⚠️.
# RSI: medidor de 0 a 100 de quão rápido o preço se moveu; abaixo de 30–35
# quer dizer que caiu rápido demais ("sobrevendido").
termometro:
  # Comprar e segurar: olha se está barato em meses e anos.
  longo_prazo:
    pontos_para_interesse: 4     # backtest (28/10/2026): com 3 pontos o resultado em 90 dias foi fraco; com 4+, bem melhor
    dias_media: 200              # 1) preço abaixo da média dos últimos 200 dias
    queda_da_maxima_anual: -20   # 2) 20% ou mais abaixo da máxima do último ano
    medo_maximo: 40              # 3) índice de medo e ganância em 40 ou menos
    rsi_diario_maximo: 35        # 4) RSI diário abaixo de 35
    horas_sem_nova_minima: 6     # 5) não fez nova mínima nas últimas 6 horas
  # Comprar e vender: olha se a queda exagerou nas últimas horas e se já está voltando.
  curto_prazo:
    pontos_para_interesse: 3
    rsi_1h_maximo: 30            # 1) RSI de 1 hora abaixo de 30
    abaixo_media_7d: -8          # 2) 8% ou mais abaixo da média dos últimos 7 dias
    medo_maximo: 40              # 3) índice de medo e ganância em 40 ou menos
    repique_minimo: 1            # 4) subiu 1% ou mais desde o fundo das últimas 2 horas
    volume_acima_normal: 50      # 5) volume das últimas 3h 50% acima do normal (pânico)

# Radar das outras moedas grandes (Fase 5).
# Olha as maiores moedas (fora BTC, ETH e SOL) e avisa só movimentos bem fortes,
# todos juntos numa mensagem só. São moedas mais arriscadas, então os limites
# são mais altos que os das suas moedas principais.
radar:
  ativo: true
  quantas: 60                  # olha as 60 maiores por valor de mercado (sobram ~40 após os filtros)
  volume_minimo_usd: 20000000  # liquidez: pelo menos US$ 20 milhões negociados em 24h
  max_detalhadas: 5            # quantas moedas ganham "por quê" e notícia na mensagem
  max_listadas: 10             # acima disso, as mais fracas aparecem só pelo símbolo
  limites_queda:
    "1h": -6
    "24h": -12
    "7d": -25
  limites_alta:
    "1h": 8
    "24h": 15
    "7d": 40
  anti_spam:                   # mesma lógica das moedas principais, mas mais espaçado
    intervalo_horas: 12
    nova_queda_minima: 5
    esquecer_apos_horas: 48
    intervalo_brusca_minutos: 60
  # Segurança: fora do radar ficam dólares digitais, ouro tokenizado e fundos
  # tokenizados (não são cripto "de verdade" e quase não mexem), além de
  # versões "embrulhadas" de outras moedas. Moedas com preço praticamente parado
  # também são ignoradas automaticamente.
  excluir:
    - tether
    - usd-coin
    - usds
    - dai
    - ethena-usde
    - usd1-wlfi
    - global-dollar
    - paypal-usd
    - ripple-usd
    - usdd
    - falcon-finance
    - united-stables
    - bfusd
    - usdgo
    - first-digital-usd
    - true-usd
    - figure-heloc
    - hashnote-usyc
    - ondo-us-dollar-yield
    - blackrock-usd-institutional-digital-liquidity-fund
    - spiko-amundi-overnight-swap-fund-eur
    - tether-gold
    - pax-gold
    - wrapped-bitcoin
    - coinbase-wrapped-btc
    - staked-ether
    - wrapped-steth
    - weth
    - wrapped-eeth
    - binance-staked-sol
    - jito-staked-sol

# Resumo diário (Fase 6): uma mensagem por dia com a situação geral.
resumo_diario:
  ativo: true
  hora: 9                      # horário de Brasília

# Painel visual (Fase 6), publicado no GitHub Pages.
painel:
  ativo: true
  endereco: https://arthurzr.github.io/WhaleRadar/

# Emojis usados nas mensagens.
emojis:
  noticia: "🌍"          # antes da notícia / explicação do motivo (Fase 3)
  zona_interesse: "🎯"   # quando a leitura indica possível zona de compra
  sem_sinal: "⚠️"        # quando a leitura NÃO indica zona de compra
